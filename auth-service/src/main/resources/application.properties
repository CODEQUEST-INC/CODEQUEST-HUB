server.port=${PORT:8081}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon's pooler silently drops idle connections well under Hikari's default
# max-lifetime. A short keepalive makes Hikari proactively ping idle pooled
# connections so a dead one is detected and replaced before a real request
# gets handed a closed connection. max-lifetime forces periodic proactive
# recycling too, and a shorter connection-timeout means a genuine failure
# surfaces in seconds instead of hanging for the 30s default.
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=604800000

# Port 2525, not the standard 587 — Render blocks outbound SMTP on 587
# entirely (connection just times out), a common cloud-host restriction.
# Brevo supports 2525 as an alternate submission port for exactly this case.
spring.mail.host=${SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${SMTP_PORT:2525}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Fail fast rather than hanging the request thread if the SMTP relay is
# unreachable (e.g. a blocked port) — EmailService already treats send
# failures as best-effort (logs and moves on), so this just bounds how long
# a caller waits before that fallback kicks in.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
mail.from=${MAIL_FROM:CODEQUESTHUB <jeremybrobbey@gmail.com>}
