server.port=8086

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon closes idle backend connections well under Hikari's default max-lifetime.
# A short keepalive makes Hikari proactively ping idle pooled connections so a
# dead one is detected and replaced instead of being handed to the next request
# and failing with "connection has been closed".
spring.datasource.hikari.keepalive-time=120000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=604800000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Local/non-Docker runs default to a fixed OS temp location instead of a path
# relative to wherever `mvn` happens to be invoked from. Docker overrides this
# to the mounted volume path (/data/uploads) so uploads survive restarts.
showcase.upload-dir=${SHOWCASE_UPLOAD_DIR:${java.io.tmpdir}/codequesthub-showcase-uploads}
