server.port=${PORT:8086}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon's pooler silently drops idle connections well under Hikari's default
# max-lifetime. A short keepalive makes Hikari proactively ping idle pooled
# connections so a dead one is detected and replaced before a real request
# gets handed a closed connection. max-lifetime forces periodic proactive
# recycling too, and a shorter connection-timeout means a genuine failure
# surfaces in seconds instead of hanging for the 30s default.
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=604800000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Local/non-Docker runs default to a fixed OS temp location instead of a path
# relative to wherever `mvn` happens to be invoked from. Docker overrides this
# to the mounted volume path (/data/uploads) so uploads survive restarts.
showcase.upload-dir=${SHOWCASE_UPLOAD_DIR:${java.io.tmpdir}/codequesthub-showcase-uploads}
