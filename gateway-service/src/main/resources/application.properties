server.port=${SERVER_PORT:8080}

# The gateway must forward request bodies byte-for-byte, untouched. If Spring's
# multipart resolver is left enabled, DispatcherServlet eagerly parses any
# multipart/form-data request before the proxy controller runs, draining the
# input stream and forwarding an empty body downstream.
spring.servlet.multipart.enabled=false

auth.service.url=${AUTH_SERVICE_URL:http://localhost:8081}
group.service.url=${GROUP_SERVICE_URL:http://localhost:8082}
project.service.url=${PROJECT_SERVICE_URL:http://localhost:8083}
task.service.url=${TASK_SERVICE_URL:http://localhost:8084}
judging.service.url=${JUDGING_SERVICE_URL:http://localhost:8085}
showcase.service.url=${SHOWCASE_SERVICE_URL:http://localhost:8086}
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8087}

# Comma-separated list of allowed CORS origins. No mobile/web client exists yet,
# so this defaults to common local dev frontend ports rather than "*".
gateway.cors.allowed-origins=${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:19006}
