server.port=8087

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.keepalive-time=120000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

payment.unit-price-kobo=${PAYMENT_UNIT_PRICE_KOBO:10000}
payment.currency=${PAYMENT_CURRENCY:GHS}
payment.callback-url=${PAYMENT_CALLBACK_URL:}

paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.base-url=${PAYSTACK_BASE_URL:https://api.paystack.co}