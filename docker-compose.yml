services:
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      GROUP_SERVICE_URL: http://group-service:8082
      PROJECT_SERVICE_URL: http://project-service:8083
      TASK_SERVICE_URL: http://task-service:8084
      JUDGING_SERVICE_URL: http://judging-service:8085
      SHOWCASE_SERVICE_URL: http://showcase-service:8086
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:19006}
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - group-service
      - project-service
      - task-service
      - judging-service
      - showcase-service

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_32chars_min}

  group-service:
    build:
      context: .
      dockerfile: group-service/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_32chars_min}

  project-service:
    build:
      context: .
      dockerfile: project-service/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_32chars_min}

  task-service:
    build:
      context: .
      dockerfile: task-service/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_32chars_min}

  judging-service:
    build:
      context: .
      dockerfile: judging-service/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_32chars_min}

  showcase-service:
    build:
      context: .
      dockerfile: showcase-service/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_32chars_min}
      SHOWCASE_UPLOAD_DIR: /data/uploads
    volumes:
      - showcase_uploads:/data/uploads

volumes:
  showcase_uploads:
