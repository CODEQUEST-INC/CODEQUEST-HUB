

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: codequest
      POSTGRES_PASSWORD: codequest_dev_pw
      POSTGRES_DB: codequesthub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codequest"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://codequest:codequest_dev_pw@postgres:5432/codequesthub
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      PORT: 4001
    ports:
      - "4001:4001"

  group-service:
    build:
      context: .
      dockerfile: services/group-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://codequest:codequest_dev_pw@postgres:5432/codequesthub
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      PORT: 4002
    ports:
      - "4002:4002"

  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://codequest:codequest_dev_pw@postgres:5432/codequesthub
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      PORT: 4003
    ports:
      - "4003:4003"

  # gateway:
  #   build:
  #     context: .
  #     dockerfile: gateway/Dockerfile
