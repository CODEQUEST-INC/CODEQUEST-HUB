

services:
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      PORT: 4001
    ports:
      - "4001:4001"

  group-service:
    build:
      context: .
      dockerfile: services/group-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      PORT: 4002
    ports:
      - "4002:4002"

  project-service:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      PORT: 4003
    ports:
      - "4003:4003"

  judging-service:
    build:
      context: .
      dockerfile: services/judging-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      PORT: 4004
    ports:
      - "4004:4004"

