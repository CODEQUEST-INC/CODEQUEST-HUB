services:
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      GROUP_SERVICE_URL: http://group-service:8082
      PROJECT_SERVICE_URL: http://project-service:8083
      TASK_SERVICE_URL: http://task-service:8084
      JUDGING_SERVICE_URL: http://judging-service:8085
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - group-service
      - project-service
      - task-service
      - judging-service

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_32chars_min}
    ports:
      - "8081:8081"

  group-service:
    build:
      context: ./group-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_32chars_min}
    ports:
      - "8082:8082"

  project-service:
    build:
      context: ./project-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_32chars_min}
    ports:
      - "8083:8083"

  task-service:
    build:
      context: ./task-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_32chars_min}
    ports:
      - "8084:8084"

  judging-service:
    build:
      context: ./judging-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_32chars_min}
    ports:
      - "8085:8085"
