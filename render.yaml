      - key: SMTP_PASSWORD
        sync: false

  - type: web
    name: gateway-service
    runtime: docker
    plan: free
    branch: main
    repo: https://github.com/CODEQUEST-INC/CODEQUEST-HUB
    dockerfilePath: ./gateway-service/Dockerfile
    dockerContext: ./gateway-service
    healthCheckPath: /health
    envVars:
      # Free-tier web services can send private-network requests but can't
      # receive them ("Free web services can send private network requests,
      # but they can't receive them" — Render docs), so gateway must reach
      # every downstream service over its public HTTPS URL instead of the
      # internal hostname. Update these if a service is ever recreated
      # (the slug in the URL can change).
      - key: AUTH_SERVICE_URL
        value: https://auth-service-cieo.onrender.com
      - key: GROUP_SERVICE_URL
        value: https://group-service-uk57.onrender.com
      - key: PROJECT_SERVICE_URL
        value: https://project-service-gyha.onrender.com
      - key: TASK_SERVICE_URL
        value: https://task-service-bt1r.onrender.com
      - key: JUDGING_SERVICE_URL
        value: https://judging-service.onrender.com
      - key: SHOWCASE_SERVICE_URL
        value: https://showcase-service.onrender.com
      - key: PAYMENT_SERVICE_URL
        value: https://payment-service-z7dc.onrender.com
      # Update once the frontend has a deployed origin (Expo web build, custom domain, etc).
      - key: GATEWAY_CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:19006,http://localhost:8081
