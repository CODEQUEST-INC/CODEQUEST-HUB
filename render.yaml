    repo: https://github.com/CODEQUEST-INC/CODEQUEST-HUB
    dockerfilePath: ./task-service/Dockerfile
    dockerContext: .
    healthCheckPath: /api/tasks/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: judging-service
    runtime: docker
    plan: free
    branch: main
    repo: https://github.com/CODEQUEST-INC/CODEQUEST-HUB
    dockerfilePath: ./judging-service/Dockerfile
    dockerContext: .
    healthCheckPath: /api/judging/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: showcase-service
    runtime: docker
    plan: free
    branch: main
    repo: https://github.com/CODEQUEST-INC/CODEQUEST-HUB
    dockerfilePath: ./showcase-service/Dockerfile
    dockerContext: .
    healthCheckPath: /api/showcase/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false

  - type: web
    name: payment-service
    runtime: docker
    plan: free
    branch: main
    repo: https://github.com/CODEQUEST-INC/CODEQUEST-HUB
    dockerfilePath: ./payment-service/Dockerfile
    dockerContext: .
    healthCheckPath: /api/payments/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: web
    name: gateway-service
    runtime: docker
    plan: free
    branch: main
    repo: https://github.com/CODEQUEST-INC/CODEQUEST-HUB
    dockerfilePath: ./gateway-service/Dockerfile
    dockerContext: ./gateway-service
    healthCheckPath: /health
    envVars:
      - key: AUTH_SERVICE_URL
        value: http://auth-service:10000
      - key: GROUP_SERVICE_URL
        value: http://group-service:10000
      - key: PROJECT_SERVICE_URL
        value: http://project-service:10000
      - key: TASK_SERVICE_URL
        value: http://task-service:10000
      - key: JUDGING_SERVICE_URL
        value: http://judging-service:10000
      - key: SHOWCASE_SERVICE_URL
        value: http://showcase-service:10000
      - key: PAYMENT_SERVICE_URL
        value: http://payment-service:10000
      # Update once the frontend has a deployed origin (Expo web build, custom domain, etc).
      - key: GATEWAY_CORS_ALLOWED_ORIGINS
        value: http://localhost:3000,http://localhost:19006,http://localhost:8081
