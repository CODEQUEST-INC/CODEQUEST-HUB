services:
  - type: web
    name: auth-service
    runtime: docker
    plan: free
    branch: main
    repo: https://github.com/CODEQUEST-INC/CODEQUEST-HUB
    dockerfilePath: ./auth-service/Dockerfile
    dockerContext: .
    healthCheckPath: /api/auth/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  - type: web
    name: group-service
    runtime: docker
    plan: free
    branch: main
    repo: https://github.com/CODEQUEST-INC/CODEQUEST-HUB
    dockerfilePath: ./group-service/Dockerfile
