name: CI

on:
  push:
    branches: [main_]
  pull_request:
    branches: [main_]

jobs:
  backend-tests:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - group-service
          - project-service
          - task-service
          - judging-service
          - showcase-service
          - gateway-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Every service depends on common-security as a local Maven artifact —
      # same install step every Dockerfile already runs before packaging.
      - name: Install common-security
        run: mvn -f common-security install -DskipTests -B

      # Surefire's default include pattern (**/*Test.java) picks up both the
      # mocked-repository unit tests and the Testcontainers-backed integration
      # tests in one run — GitHub's ubuntu-latest runners have Docker
      # preinstalled, so Testcontainers works with no extra setup.
      - name: Test ${{ matrix.service }}
        run: mvn -f ${{ matrix.service }} test -B

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
