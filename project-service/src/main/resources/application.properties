server.port=${PORT:8083}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon's pooler silently drops idle connections well under Hikari's default
# max-lifetime. A short keepalive makes Hikari proactively ping idle pooled
# connections so a dead one is detected and replaced before a real request
# gets handed a closed connection. max-lifetime forces periodic proactive
# recycling too, and a shorter connection-timeout means a genuine failure
# surfaces in seconds instead of hanging for the 30s default.
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=604800000

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

r2.account-id=${R2_ACCOUNT_ID}
r2.access-key-id=${R2_ACCESS_KEY_ID}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY}
r2.bucket=${R2_BUCKET}
